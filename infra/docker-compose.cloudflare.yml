# Compose-Override für den Betrieb hinter einem externen Cloudflare Tunnel
# (oder einem anderen vorgelagerten Reverse Proxy), der bereits läuft –
# z.B. cloudflared auf dem Proxmox-Host oder in einem separaten LXC.
#
# Wirkung gegenüber der Standard-Compose:
#   - Caddy terminiert KEIN TLS mehr, sondern routet nur intern über HTTP
#     (Caddyfile.http) und lauscht auf Port 80.
#   - Es wird ausschließlich ein einzelner HTTP-Port am LXC veröffentlicht
#     (HTTP_PORT, Standard 8080) – kein 80/443. Dein externer Tunnel zeigt
#     auf http://<LXC-IP>:${HTTP_PORT}.
#
# Aufruf (beide Dateien kombinieren):
#   docker compose --env-file .env \
#     -f infra/docker-compose.yml \
#     -f infra/docker-compose.cloudflare.yml up -d --build
#
# Benötigt Docker Compose v2.24.4+ (für das `!override`-Tag, das die Port-Liste
# ersetzt statt sie zu ergänzen). Aktuelle Docker-Installationen erfüllen das.

services:
  caddy:
    ports: !override
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./Caddyfile.http:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
