<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Schichtbuch – Instandhaltung</title>
    <script>
      // Theme vor dem ersten Paint setzen, um Aufflackern (FOUC) zu vermeiden.
      (function () {
        try {
          var stored = localStorage.getItem("schichtbuch.theme");
          var dark =
            stored === "dark" ||
            ((!stored || stored === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {
          /* localStorage nicht verfügbar – Standard (hell) */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
